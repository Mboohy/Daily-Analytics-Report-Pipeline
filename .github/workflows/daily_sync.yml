name: Daily Data Sync to Google Sheets

on:
  schedule:
    # 4 times a day (UTC): 02:00, 08:00, 14:00, 20:00
    # = 04:00, 10:00, 16:00, 22:00 Cairo time (UTC+2)
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:

# Prevent two runs from writing to the same Google Sheets at once
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync_data:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Config and Credentials files
        run: |
          echo '${{ secrets.CONFIG_JSON }}' > config.json
          echo '${{ secrets.GCP_CREDENTIALS }}' > credentials.json

      - name: Run Data Sync Script
        run: python main.py

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f config.json
          rm -f credentials.json
