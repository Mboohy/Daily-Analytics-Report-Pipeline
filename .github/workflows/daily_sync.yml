name: Daily Data Sync to Google Sheets

on:
  schedule:
    - cron: '0 2 * * *' # يعمل يومياً الساعة 2 صباحاً UTC
  workflow_dispatch: # يتيح لك تشغيل السكربت يدوياً من واجهة GitHub

jobs:
  sync_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # متوافق مع متطلبات المشروع

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Config and Credentials files
        run: |
          echo '${{ secrets.CONFIG_JSON }}' > config.json
          echo '${{ secrets.GCP_CREDENTIALS }}' > credentials.json

      - name: Run Data Sync Script
        run: python main.py

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f config.json
          rm -f credentials.json
